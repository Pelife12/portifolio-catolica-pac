# nginx do PWA em homologação.
#
# Três regras importam para o modo offline funcionar e atualizar direito:
# - sw.js e index.html nunca vão para cache HTTP: senão o navegador não enxerga
#   versão nova do app;
# - /assets/* tem hash no nome e pode ficar em cache "para sempre";
# - qualquer rota desconhecida devolve o index.html (SPA com React Router).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
