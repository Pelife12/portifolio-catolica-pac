services:
  db:
    image: postgres:16-alpine
    container_name: compostagem-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-compostagem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-compostagem}
      POSTGRES_DB: ${POSTGRES_DB:-compostagem}
      TZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-compostagem} -d ${POSTGRES_DB:-compostagem}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: compostagem-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-compostagem}:${POSTGRES_PASSWORD:-compostagem}@db:5432/${POSTGRES_DB:-compostagem}
      AMBIENTE: ${AMBIENTE:-desenvolvimento}
      DEBUG: ${DEBUG:-true}
      TZ: America/Sao_Paulo
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/saude || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
